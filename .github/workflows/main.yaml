name: linkding CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit_test_plan:
    name: Unit Tests / Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          mkdir data
      - name: Install Datadog Test Parallelization
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-linux-amd64 -o bin/ddtest
          chmod +x bin/ddtest
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Plan tests
        id: dd_plan
        run: |
          rm -rf .testoptimization
          bin/ddtest plan --platform python --framework pytest --min-parallelism 1 --max-parallelism 4
      - name: Upload test plan
        uses: actions/upload-artifact@v4
        with:
          name: ddtest-unit-plan
          path: .testoptimization/
          include-hidden-files: true
          if-no-files-found: error
  unit_tests:
    name: Unit Tests
    needs: unit_test_plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unit_test_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          mkdir data
      - name: Install Datadog Test Parallelization
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-linux-amd64 -o bin/ddtest
          chmod +x bin/ddtest
      - name: Download test plan
        uses: actions/download-artifact@v4
        with:
          name: ddtest-unit-plan
          path: .testoptimization/
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Run tests
        run: |
          test -f .testoptimization/manifest.txt
          bin/ddtest run --platform python --framework pytest --ci-node ${{ matrix.ci_node_index }}
  e2e_test_plan:
    name: E2E Tests / Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          uv run playwright install chromium
          mkdir data
      - name: Run build
        run: |
          npm run build
          uv run manage.py collectstatic
      - name: Install Datadog Test Parallelization
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-linux-amd64 -o bin/ddtest
          chmod +x bin/ddtest
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Plan tests
        id: dd_plan
        env:
          PYTEST_ADDOPTS: '-o "python_files=e2e_test_*.py"'
        run: |
          rm -rf .testoptimization
          bin/ddtest plan bookmarks/tests_e2e --platform python --framework pytest --min-parallelism 1 --max-parallelism 4
      - name: Upload test plan
        uses: actions/upload-artifact@v4
        with:
          name: ddtest-e2e-plan
          path: .testoptimization/
          include-hidden-files: true
          if-no-files-found: error
  e2e_tests:
    name: E2E Tests
    needs: e2e_test_plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e_test_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          uv run playwright install chromium
          mkdir data
      - name: Run build
        run: |
          npm run build
          uv run manage.py collectstatic
      - name: Install Datadog Test Parallelization
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-linux-amd64 -o bin/ddtest
          chmod +x bin/ddtest
      - name: Download test plan
        uses: actions/download-artifact@v4
        with:
          name: ddtest-e2e-plan
          path: .testoptimization/
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Run tests
        env:
          PYTEST_ADDOPTS: '-o "python_files=e2e_test_*.py"'
        run: |
          test -f .testoptimization/manifest.txt
          bin/ddtest run --platform python --framework pytest --ci-node ${{ matrix.ci_node_index }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.ci_node_index }}
          path: test-results/screenshots
